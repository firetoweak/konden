name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - id: classify
        name: Classify changed scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci_scope.py classify

  docs:
    name: Docs
    needs: scope
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run documentation verification
        run: python scripts/ci.py docs

  python:
    name: Python (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Run default verification
        run: python scripts/ci.py python
      - name: Upload Python test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: python-${{ matrix.os }}
          path: .tools/test-results/*.xml
          retention-days: 14

  web:
    name: Web
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run web verification
        run: python scripts/ci.py web

  formal:
    name: Formal (TLC)
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - uses: actions/cache@v6
        with:
          path: .tools/formal/deps
          key: tlc-${{ hashFiles('formal/toolchain.json') }}
      - name: Check bounded models
        run: python scripts/ci.py formal

  process:
    name: Process (${{ matrix.os }}, ${{ matrix.group }})
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        group: [compact, supervisor, execution, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use the runner temp disk on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
      - name: Allow the application Chrome sandbox on Ubuntu
        if: runner.os == 'Linux' && matrix.group == 'integration'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/konden-chrome.apparmor" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile konden-ci-chrome "$GITHUB_WORKSPACE/.tools/runtime/chrome/chrome" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$RUNNER_TEMP/konden-chrome.apparmor"
      - name: Restore pinned application tools
        uses: actions/cache@v6
        with:
          path: .tools/runtime
          key: app-tools-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group == 'integration' && 'browser' || 'cli' }}-${{ hashFiles('scripts/runtime_tools.json') }}
      - name: Prepare pinned application tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.prepare_ci_tools
      - name: Verify process contracts
        run: python scripts/ci.py process --process-group ${{ matrix.group }} --workers 2
      - name: Upload process test report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: process-${{ matrix.os }}-${{ matrix.group }}
          path: .tools/test-results/*.xml
          retention-days: 14

  ci:
    name: CI
    needs: [scope, docs, python, web, formal, process]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Require successful merge checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          PROCESS_RESULT: ${{ needs.process.result }}
        run: python scripts/ci_scope.py verify
